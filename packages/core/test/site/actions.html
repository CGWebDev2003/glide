<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glide actions test page</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #0f1115; color: #f3f1ea; font: 20px/1.5 system-ui, sans-serif; }
    section { min-height: 100vh; padding: 12vh 8vw; border-top: 1px solid #222; }
    h1 { font-size: 96px; line-height: 1; }
    h2 { font-size: 56px; margin-bottom: 6vh; }
    .buttons { display: flex; gap: 6vw; }
    .btn { padding: 28px 56px; font: 700 28px system-ui; border: 0; border-radius: 16px; color: #fff; background: #3a86ff;
           transition: transform .4s ease, background-color .4s ease; }
    .btn:hover { transform: scale(1.15); background: #ff5a36; }
    .acc { max-width: 700px; border: 2px solid #333; border-radius: 16px; padding: 24px; }
    .acc button { font: 700 26px system-ui; background: none; color: inherit; border: 0; cursor: pointer; }
    .acc-body { opacity: 0; transform: translateY(-20px); transition: opacity .5s ease, transform .5s ease; margin-top: 16px; }
    .acc.open .acc-body { opacity: 1; transform: none; }
    #away { display: inline-block; margin-top: 6vh; font-size: 28px; color: #ffbe0b; }
  </style>
</head>
<body>
  <section><h1>Actions</h1></section>
  <section>
    <h2>Hover</h2>
    <div class="buttons"><button class="btn" id="b1">Eins</button><button class="btn" id="b2">Zwei</button></div>
  </section>
  <section>
    <h2>Click</h2>
    <div class="acc">
      <button type="button">Weniger</button>
      <button type="button">Mehr erfahren</button>
      <div class="acc-body">Aufgeklappt.</div>
    </div>
    <a id="away" href="/elsewhere.html">Zu einer anderen Seite</a>
  </section>
  <section><h2>Filler</h2></section>
  <script>
    document.querySelectorAll('.acc button')[1].addEventListener('click', (e) => e.target.closest('.acc').classList.toggle('open'));
    window.awayClicks = 0;
    document.getElementById('away').addEventListener('click', () => { window.awayClicks++; });
  </script>
</body>
</html>
