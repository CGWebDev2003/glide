<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glide actions test page</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #0f1115; color: #f3f1ea; font: 20px/1.5 system-ui, sans-serif; }
    section { min-height: 100vh; padding: 12vh 8vw; border-top: 1px solid #222; }
    h1 { font-size: 96px; line-height: 1; }
    h2 { font-size: 56px; margin-bottom: 6vh; }
    .buttons { display: flex; gap: 6vw; }
    .btn { padding: 28px 56px; font: 700 28px system-ui; border: 0; border-radius: 16px; color: #fff; background: #3a86ff;
           transition: transform .4s ease, background-color .4s ease; }
    .btn:hover { transform: scale(1.15); background: #ff5a36; }
    .acc { max-width: 700px; border: 2px solid #333; border-radius: 16px; padding: 24px; }
    .acc button { font: 700 26px system-ui; background: none; color: inherit; border: 0; cursor: pointer; }
    .acc-body { opacity: 0; transform: translateY(-20px); transition: opacity .5s ease, transform .5s ease; margin-top: 16px; }
    .acc.open .acc-body { opacity: 1; transform: none; }
    .consent-wrap { position: fixed; right: 16px; top: 16px; z-index: 10; }
    .consent { background: #fff; color: #000; padding: 12px 16px; border-radius: 10px; font-size: 14px; display: flex; gap: 12px; align-items: center; }
    #away { display: inline-block; margin-top: 6vh; font-size: 28px; color: #ffbe0b; }
    .search { display: flex; gap: 16px; align-items: center; }
    .search input, #email, #ro, #note { font: 28px system-ui; padding: 14px 18px; width: 520px; border: 2px solid #333; border-radius: 12px; background: #fff; color: #000; }
    .search input:focus, #email:focus, #note:focus { outline: 3px solid #3a86ff; }
    #ro, #note { display: block; margin-top: 16px; }
    #echo { min-height: 1.5em; margin: 16px 0 4vh; color: #06d6a0; }
  </style>
</head>
<body>
  <div class="consent-wrap"><div class="consent"><p>Wir nutzen Cookies.</p><button type="button">OK</button></div></div>
  <section><h1>Actions</h1></section>
  <section>
    <h2>Hover</h2>
    <div class="buttons"><button class="btn" id="b1">Eins</button><button class="btn" id="b2">Zwei</button></div>
  </section>
  <section>
    <h2>Click</h2>
    <div class="acc">
      <button type="button">Weniger</button>
      <button type="button">Mehr erfahren</button>
      <div class="acc-body">Aufgeklappt.</div>
    </div>
    <a id="away" href="/elsewhere.html">Zu einer anderen Seite</a>
  </section>
  <section>
    <h2>Type</h2>
    <form class="search" action="/search.html">
      <label for="q">Suche</label>
      <input id="q" type="search" name="q" placeholder="Suchen…" autocomplete="off">
    </form>
    <p id="echo"></p>
    <input id="email" type="email" value="alt@example.com" autocomplete="off">
    <input id="ro" readonly value="nur lesen">
    <div id="note" contenteditable="true">alter Text</div>
  </section>
  <section><h2>Filler</h2></section>
  <script>
    document.querySelectorAll('.acc button')[1].addEventListener('click', (e) => e.target.closest('.acc').classList.toggle('open'));
    window.awayClicks = 0;
    document.getElementById('away').addEventListener('click', () => { window.awayClicks++; });
    window.keys = 0;
    window.allKeys = 0;
    document.addEventListener('keydown', () => { window.allKeys++; }, true);
    const q = document.getElementById('q');
    q.addEventListener('keydown', () => { window.keys++; });
    window.keyups = 0;
    q.addEventListener('keyup', () => { window.keyups++; });
    q.addEventListener('input', () => { document.getElementById('echo').textContent = q.value; });
  </script>
</body>
</html>
